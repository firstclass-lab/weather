name: Daily Weather Check

on:
  schedule:
    # 日本時間 05:00 〜 18:00 (UTC 20:00 〜 09:00)
    # 1時間おき（毎時0分）に実行する設定
    - cron: '0 20-23 * * *'  # 日本時間 05:00, 06:00, 07:00, 08:00
    - cron: '0 0-9 * * *'    # 日本時間 09:00 〜 18:00
  workflow_dispatch:         # 手動実行ボタンを残す（動作確認に便利です）

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # ここが重要：書き込み権限を付与
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run weather check
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python weather.py

      - name: Commit and push HTML
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Update weather info" || echo "No changes to commit"
          git push
